name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Security scan (blocks on any finding)
        run: python3 scripts/scan.py registry

      - name: Validate (schema + license + lock + re-scan)
        run: python3 scripts/validate.py

      - name: Build all tool images
        run: python3 scripts/build.py --tool all

      - name: Root marketplace is in sync with the registry
        run: python3 scripts/build_marketplace.py --check

      - name: Test suite
        run: bash tests/run_tests.sh
