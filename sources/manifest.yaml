# agent-forge upstream manifest
#
# Every source is pinned to an exact commit SHA. scripts/sync.py clones each
# source at that SHA, runs scripts/scan.py over every candidate file, and:
#   * vendors (copies into registry/) items that are BOTH permissively licensed
#     AND pass the scanner with zero blocking findings;
#   * records everything else as a "reference" entry in catalog.yaml (with the
#     reason) — never silently dropped.
#
# mode:
#   vendor    -> copy items into the registry (still subject to scan+license gate)
#   auto      -> vendor if clean+permissive, else reference
#   reference -> never copied; cataloged as a pointer to upstream
#   submodule -> registered as a git submodule under sources/vendor/ (for large
#                or fast-moving upstreams); supported by sync.py, unused by the
#                current seed because both upstreams are cleanly vendorable.

sources:
  - id: wshobson-agents
    repo: https://github.com/wshobson/agents
    commit: 0818067b4ecad18c234b2ae427cc44f2053792d4
    license: MIT
    kind: agents
    mode: vendor
    agents:
      # --- optimization (token / context efficiency) ---
      - src: plugins/context-management/agents/context-manager.md
        name: context-manager
        domain: optimization
      - src: plugins/llm-application-dev/agents/prompt-engineer.md
        name: prompt-engineer
        domain: optimization
      # --- backend ---
      - src: plugins/backend-development/agents/backend-architect.md
        name: backend-architect
        domain: backend
      - src: plugins/database-design/agents/sql-pro.md
        name: sql-pro
        domain: backend
      - src: plugins/application-performance/agents/performance-engineer.md
        name: performance-engineer
        domain: backend
      # --- languages ---
      - src: plugins/python-development/agents/python-pro.md
        name: python-pro
        domain: languages
      - src: plugins/systems-programming/agents/golang-pro.md
        name: golang-pro
        domain: languages
      - src: plugins/systems-programming/agents/rust-pro.md
        name: rust-pro
