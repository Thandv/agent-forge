      - src: plugins/comprehensive-review/agents/architect-review.md
        name: architect-review
        domain: review
      - src: plugins/backend-development/agents/test-automator.md
        name: test-automator
        domain: review
      - src: plugins/tdd-workflows/agents/tdd-orchestrator.md
        name: tdd-orchestrator
        domain: review
      - src: plugins/debugging-toolkit/agents/debugger.md
        name: debugger
