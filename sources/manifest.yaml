  - id: anthropics-skills
    repo: https://github.com/anthropics/skills
    commit: da20c92503b2e8ff1cf28ca81a0df4673debdbf7
    kind: skills
    mode: auto                 # license + scan decide vendor vs reference per skill
    skills_dir: skills
    skills:
      - algorithmic-art
      - brand-guidelines
      - canvas-design
      - frontend-design
      - internal-comms
      - skill-creator
      - slack-gif-creator
      - theme-factory
      - web-artifacts-builder
      - claude-api            # expected REFERENCE (code samples read API keys)
      - mcp-builder           # expected REFERENCE (MCP server samples read secrets)
      - webapp-testing        # expected REFERENCE (uses subprocess shell=True)
    # Proprietary upstream license -> always reference, never vendored:
    reference:
      - docx
      - pdf
      - pptx
      - xlsx
      - doc-coauthoring       # no upstream LICENSE file -> license unclear
